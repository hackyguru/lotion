name: _release-module

# Local reusable workflow — the single place that owns this repo's
# signing configuration. Both per-module workflows (release-lotion-core,
# release-lotion-ui) and the umbrella (release-all) delegate here, so
# switching signing modes only means editing THIS file, never the callers.
#
# The leading underscore marks it "private": it has only `workflow_call`
# (no `workflow_dispatch`), so it never shows up as a runnable item in
# the Actions UI.
#
# ── Why this repo publishes its own .lgx ─────────────────────────────
# This is a monorepo: `lotion-core` (package `lotion`) and `lotion-ui`
# (package `lotion_ui`) each have their own flake.nix + metadata.json.
# The catalog at hackyguru/logos-modules builds one module per git
# submodule ROOT, so it cannot target a subdirectory. Instead this repo
# builds and signs its own packages, and the catalog indexes the release
# assets by URL (see external-modules.txt over there).
#
# ── Signing ──────────────────────────────────────────────────────────
# `signing_mode: inline` runs `lgx sign` in the workflow using the
# LOGOS_SIGNING_KEY secret (an Ed25519 JWK private key). It MUST be the
# same key whose public DID is listed under `trustedSigners` in
# hackyguru/logos-modules' logos-repo.json — otherwise Basecamp will
# treat these packages as untrusted.

on:
  workflow_call:
    inputs:
      module_path:
        description: "Subdirectory holding the module (lotion-core or lotion-ui)."
        type: string
        required: true
      force_build:
        description: |
          Force build — rebuild and REPLACE the already-published
          `<module>-v<version>` release instead of skipping it. Maps to
          the action's `skip_if_published` (inverted): false (default) =
          skip a version that's already fully published; true = republish
          the same version, overwriting its assets.
        type: boolean
        default: false

# The downstream release job needs to create releases / upload assets.
permissions:
  contents: write

jobs:
  release:
    uses: logos-co/logos-modules-release-action/.github/workflows/release.yml@v1
    with:
      module_path: ${{ inputs.module_path }}

      # Normal runs skip a version that's already fully published; "Force
      # build" (force_build: true) republishes it by disabling that skip.
      skip_if_published: ${{ !inputs.force_build }}

      signing_mode: inline

    secrets:
      signing_key: ${{ secrets.LOGOS_SIGNING_KEY }}
